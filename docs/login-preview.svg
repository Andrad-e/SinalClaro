<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1330"/>
      <stop offset="0.5" stop-color="#101B45"/>
      <stop offset="1" stop-color="#06142E"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.3" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#2F6BFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.6" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
    <filter id="blurEl"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="390" height="844" fill="url(#bg)"/>
  <circle cx="20" cy="40" r="170" fill="url(#orb1)"/>
  <circle cx="370" cy="560" r="150" fill="url(#orb2)"/>
  <circle cx="380" cy="300" r="100" fill="url(#orb3)"/>

  <!-- status bar -->
  <text x="195" y="34" text-anchor="middle" fill="#F8FAFC" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600">9:41</text>

  <!-- brand -->
  <rect x="24" y="76" width="40" height="40" rx="12" fill="url(#logo)"/>
  <path d="M38 96c1-1 3-7 5-7s2 4 3 4 1-3 3-3 2 5 4 5" stroke="#F8FAFC" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="76" y="103" fill="#F8FAFC" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Sinal<tspan fill="#22D3EE">.claro</tspan></text>

  <!-- badge -->
  <rect x="24" y="136" width="172" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
  <circle cx="40" cy="149" r="3" fill="#34D399"/>
  <text x="50" y="153" fill="rgba(248,250,252,0.75)" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600">Painel institucional</text>

  <!-- title -->
  <text x="24" y="200" fill="#F8FAFC" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="800">Acesse a gestão</text>
  <text x="24" y="226" fill="#F8FAFC" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="800">do atendimento</text>
  <text x="24" y="252" fill="rgba(248,250,252,0.65)" font-family="Helvetica, Arial, sans-serif" font-size="12.5">Catálogo, frases e telemetria agregada da</text>
  <text x="24" y="268" fill="rgba(248,250,252,0.65)" font-family="Helvetica, Arial, sans-serif" font-size="12.5">sua unidade. O atendimento continua offline.</text>

  <!-- card -->
  <rect x="24" y="296" width="342" height="420" rx="24" fill="rgba(255,255,255,0.055)" stroke="rgba(255,255,255,0.12)"/>

  <!-- email field -->
  <rect x="46" y="324" width="298" height="58" rx="16" fill="rgba(255,255,255,0.05)" stroke="#22D3EE" stroke-width="1.5"/>
  <circle cx="68" cy="353" r="7" fill="none" stroke="rgba(248,250,252,0.55)" stroke-width="1.4"/>
  <text x="84" y="341" fill="#67E8F9" font-family="Helvetica, Arial, sans-serif" font-size="10">E-mail institucional</text>
  <text x="84" y="360" fill="#F8FAFC" font-family="Helvetica, Arial, sans-serif" font-size="14">contato@unidade.gov.br</text>

  <!-- password field -->
  <rect x="46" y="396" width="298" height="58" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="61" y="418" width="13" height="10" rx="2" fill="none" stroke="rgba(248,250,252,0.55)" stroke-width="1.4"/>
  <text x="84" y="414" fill="rgba(248,250,252,0.45)" font-family="Helvetica, Arial, sans-serif" font-size="10">Senha</text>
  <text x="84" y="433" fill="#F8FAFC" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="2">••••••••</text>
  <path d="M312 423c3-3 8-5 13-5s10 2 13 5c-3 3-8 5-13 5s-10-2-13-5z" fill="none" stroke="rgba(248,250,252,0.45)" stroke-width="1.3"/>

  <!-- remember / forgot -->
  <rect x="46" y="470" width="36" height="20" rx="10" fill="#2F6BFF"/>
  <circle cx="74" cy="480" r="8" fill="#F8FAFC"/>
  <text x="90" y="484" fill="rgba(248,250,252,0.7)" font-family="Helvetica, Arial, sans-serif" font-size="12">Lembrar instituição</text>
  <text x="344" y="484" text-anchor="end" fill="#67E8F9" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Esqueci minha senha</text>

  <!-- button -->
  <rect x="46" y="512" width="298" height="56" rx="16" fill="url(#btn)"/>
  <text x="195" y="546" text-anchor="middle" fill="#04101F" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Entrar no painel</text>

  <!-- divider -->
  <line x1="46" y1="594" x2="160" y2="594" stroke="rgba(255,255,255,0.12)"/>
  <text x="195" y="598" text-anchor="middle" fill="rgba(248,250,252,0.4)" font-family="Helvetica, Arial, sans-serif" font-size="11">ou</text>
  <line x1="230" y1="594" x2="344" y2="594" stroke="rgba(255,255,255,0.12)"/>

  <!-- sso -->
  <rect x="46" y="616" width="298" height="52" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
  <text x="195" y="647" text-anchor="middle" fill="#F8FAFC" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Continuar com SSO da instituição</text>

  <!-- footer -->
  <text x="24" y="744" fill="rgba(248,250,252,0.45)" font-family="Helvetica, Arial, sans-serif" font-size="10.5">Nenhuma imagem ou áudio de atendimento passa por</text>
  <text x="24" y="758" fill="rgba(248,250,252,0.45)" font-family="Helvetica, Arial, sans-serif" font-size="10.5">aqui — o reconhecimento continua local, no aparelho.</text>

  <text x="195" y="796" text-anchor="middle" fill="rgba(248,250,252,0.45)" font-family="Helvetica, Arial, sans-serif" font-size="12">Sua instituição ainda não tem acesso? <tspan fill="#67E8F9" font-weight="700">Solicitar cadastro</tspan></text>
</svg>
